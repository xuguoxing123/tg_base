spring.application.name=telegram

# bot token 通过环境变量注入，避免明文提交泄露（在 @BotFather 创建/用 /revoke 重新生成）
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:xgx_test_private_bot}

# 本地 HTTP 代理（VPN 客户端的 HTTP/混合代理端口），不需要代理时设置 TELEGRAM_PROXY_PORT=0
telegram.bot.proxy-host=${TELEGRAM_PROXY_HOST:127.0.0.1}
telegram.bot.proxy-port=${TELEGRAM_PROXY_PORT:7890}

# Long-polling hold time in seconds. Default SDK value (50) keeps the HTTPS
# tunnel open long enough for the local proxy to drop it mid-read, causing
# "SSL peer shut down incorrectly". Lower it to reduce those resets (0 = keep SDK default).
telegram.bot.long-polling-timeout=${TELEGRAM_LONG_POLL_TIMEOUT:25}

# Logging is configured in logback-spring.xml (levels, appenders, rolling policy).
# Override log directory here if needed:
# logging.file.path=logs

# ===== MySQL DataSource =====
spring.datasource.url=jdbc:mysql://localhost:3306/telegram_bot?useSSL=false&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus =====
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ===== Worker thread pool (async dispatch) =====
telegram.worker-pool-size=4

# ===== Web server (admin API + static page) =====
server.port=8080
